<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kiko HMR · SPA</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      h1 {
        margin-bottom: 0.25rem;
      }
      .counters {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 1rem;
        margin-top: 1.5rem;
      }
      .counter {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 1rem;
      }
      .counter h2 {
        margin-top: 0;
        font-size: 1rem;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      button {
        padding: 0.4rem 0.8rem;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .hint {
        color: #666;
        font-size: 0.9rem;
        line-height: 1.6;
      }
      code {
        background: #f4f4f4;
        padding: 0 0.25rem;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
