name: Publish to npm

# Release flow: create a GitHub Release with tag matching the package versions
# (e.g. `v0.0.2`), and @kikojs/signal, @kikojs/dom, @kikojs/router are
# published to npm (in dependency order) after the full quality gate passes.

on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # npm provenance attestations

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm_token

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
          cache: true

      # OIDC trusted publishing handles npm authentication through the
      # `npm_token` environment; no NODE_AUTH_TOKEN secret is required.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

      # Packages resolve each other (and jsxImportSource) through dist/
      # entry points, so dist must exist before typecheck (see ci.yml).
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # npm does NOT rewrite the `workspace:` protocol at publish time (it
      # lands in the tarball verbatim and breaks consumers), so set the package
      # versions from the release tag and rewrite inter-package deps to the
      # actual versions before publishing.
      #
      # Examples:
      #   v0.0.2          -> packages version 0.0.2, dist-tag latest
      #   v0.0.2-beta.1   -> packages version 0.0.2-beta.1, dist-tag beta
      #   v0.0.2-rc1      -> packages version 0.0.2-rc1, dist-tag beta
      - name: Set package versions from tag and resolve workspace deps
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${VERSION#v}"
          node -e "
            const fs = require('fs');
            const names = [
              'packages/signal/package.json',
              'packages/dom/package.json',
              'packages/router/package.json',
            ];
            const version = process.env.VERSION;

            if (!version) {
              console.error('VERSION is empty; expected a tag like v0.0.2 or v0.0.2-beta.1');
              process.exit(1);
            }

            const packages = names.map(name => {
              const path = name;
              const json = JSON.parse(fs.readFileSync(path, 'utf8'));
              json.version = version;
              fs.writeFileSync(path, JSON.stringify(json, null, 2) + '\n');
              return { name, version: json.version };
            });

            const signal = packages[0].version;
            const dom = packages[1].version;
            const routerPath = 'packages/router/package.json';
            const router = JSON.parse(fs.readFileSync(routerPath, 'utf8'));
            router.dependencies['@kikojs/signal'] = signal;
            router.dependencies['@kikojs/dom'] = dom;
            fs.writeFileSync(routerPath, JSON.stringify(router, null, 2) + '\n');

            console.log('set versions to ' + version);
            console.log('workspace deps rewritten to @kikojs/signal@' + signal + ', @kikojs/dom@' + dom);
          "

      # Order matters: @kikojs/router depends on the other two.
      # Prerelease tags publish to the beta dist-tag; stable tags publish to latest.
      # Authentication is handled by the `npm_token` environment + OIDC trusted
      # publishing; no NODE_AUTH_TOKEN / NPM_TOKEN secret is required.
      - name: Publish packages
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${VERSION#v}"
          if [[ "$VERSION" == *-* ]]; then
            NPM_TAG="beta"
          else
            NPM_TAG="latest"
          fi

          npm publish \
            --workspace @kikojs/signal \
            --workspace @kikojs/dom \
            --workspace @kikojs/router \
            --tag "$NPM_TAG" \
            --provenance
