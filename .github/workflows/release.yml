name: Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm_token
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      # pushing a tag whose history includes release.yml edits needs this
      workflows: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history for auto-changeset

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run fmt:check

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test --isolate

      - name: Auto-generate changeset from commits
        run: bun run auto-changeset

      # `changeset publish` shells out to `npm publish`, which needs npm >= 11.5
      # for OIDC trusted publishing (the runner's default npm is too old).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun run release
          version: bun run version-packages
          commit: "chore: release"
          title: "chore: release"
        env:
          NPM_CONFIG_FETCH_TIMEOUT: "60000" # fail fast on stalled publish requests instead of hanging until the job timeout
          NPM_CONFIG_FETCH_RETRIES: "3"
          NPM_CONFIG_PROVENANCE: "true" # OIDC trusted publishing; no NPM_TOKEN secret needed
